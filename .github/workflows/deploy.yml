name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Build Lumipals into dist/play, Marbles into dist/marbles and the coloring book into dist/coloring, and add the site's pages
        run: |
          npm run build
          npx vite build --config marbles/vite.config.js
          npx vite build --config coloring/vite.config.js
          cp -r site/. dist/
          echo "{\"version\":\"$GITHUB_SHA\"}" > dist/site-version.json
          sed -i "s/__SITE_VERSION__/$GITHUB_SHA/" dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
