name: Deploy Supabase functions

# Deploys the payment functions in supabase/functions. Needs these repository secrets (see PAYMENTS.md):
#   SUPABASE_ACCESS_TOKEN (required), LEMONSQUEEZY_API_KEY, LEMONSQUEEZY_WEBHOOK_SECRET
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/supabase-functions.yml']
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wapxwfpgrijxaclsbwkq
    steps:
      - name: Check for the Supabase access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping: add the SUPABASE_ACCESS_TOKEN secret to deploy payment functions (see PAYMENTS.md)."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.missing != 'true'

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.missing != 'true'
        with:
          version: latest

      - name: Store payment secrets in Supabase
        if: steps.token.outputs.missing != 'true'
        env:
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}
        run: |
          args=()
          for name in LEMONSQUEEZY_API_KEY LEMONSQUEEZY_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --yes "${args[@]}"
          fi

      - name: Deploy functions
        if: steps.token.outputs.missing != 'true'
        run: |
          # --yes: CI can't answer the CLI's confirmation prompts
          supabase functions deploy create-checkout --project-ref "$PROJECT_REF" --yes
          supabase functions deploy lemonsqueezy-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --yes
