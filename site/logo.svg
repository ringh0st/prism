<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset=".5" stop-color="#ff5fa2"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
 <radialGradient id="bhalo" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="btop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#ffe1f0" stop-opacity=".8"/></linearGradient>
 <linearGradient id="bleft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#ffc1dc" stop-opacity=".7"/></linearGradient>
 <linearGradient id="bright" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#c9a6ff" stop-opacity=".75"/></linearGradient>
 <linearGradient id="bout" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff27a"/><stop offset="1" stop-color="#ffffff" stop-opacity=".0"/></linearGradient>
 <filter id="bblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="bsoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="bds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1b0b4a" flood-opacity=".35"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bbg)"/>
<circle cx="256" cy="290" r="250" fill="url(#bhalo)"/>
<!-- outgoing beam (behind top face edge so it emerges from it) -->
<rect x="236" y="-20" width="40" height="250" rx="20" fill="url(#bout)" filter="url(#bblur)"/>
<rect x="244" y="-20" width="24" height="250" rx="12" fill="url(#bout)"/>
<!-- incoming beam -->
<rect x="-20" y="296" width="190" height="40" rx="20" fill="#ffd27a" filter="url(#bblur)" opacity=".9"/>
<rect x="-20" y="304" width="190" height="24" rx="12" fill="#fff"/>
<g filter="url(#bds)">
 <polygon points="130,211 256,284 256,430 130,357" fill="url(#bleft)"/>
 <polygon points="256,284 382,211 382,357 256,430" fill="url(#bright)"/>
 <!-- beam inside the glass -->
 <path d="M150 316 L256 316 L256 210" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".55" filter="url(#bsoft)"/>
 <path d="M150 316 L256 316 L256 210" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
 <circle cx="256" cy="316" r="30" fill="#fff" filter="url(#bblur)"/>
 <circle cx="256" cy="316" r="12" fill="#fff"/>
 <polygon points="256,138 382,211 256,284 130,211" fill="url(#btop)"/>
 <ellipse cx="256" cy="211" rx="34" ry="20" fill="#fff" filter="url(#bsoft)"/>
 <polygon points="256,138 382,211 382,357 256,430 130,357 130,211" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" opacity=".95"/>
 <polyline points="130,211 256,284 382,211" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" opacity=".8"/>
 <line x1="256" y1="284" x2="256" y2="430" stroke="#fff" stroke-width="5" opacity=".6"/>
 <!-- specular -->
 <polygon points="150,226 176,213 176,300 150,313" fill="#fff" opacity=".45"/>
</g>
</svg>